# Hourly unattended refresh of the Car Tracker. Runs on GitHub's servers, so no computer has to be on.
name: Hourly refresh
on:
  schedule:
    - cron: '43 * * * *'   # every hour at minute 43 (UTC)
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
permissions:
  contents: write           # commit and push the rebuilt files
  pages: write              # ask GitHub Pages to rebuild after a push
concurrency:
  group: hourly-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the commit count is right
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "TRACKER_OUT_DIR=$RUNNER_TEMP/tracker-out" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tracker-out"
      - name: Run the tracker script (--auto)
        id: run
        run: |
          before=$(git rev-parse HEAD)
          node update-tracker.js --auto
          after=$(git rev-parse HEAD)
          if [ "$before" != "$after" ]; then echo "pushed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Rebuild GitHub Pages after a push
        if: steps.run.outputs.pushed == 'true'
        continue-on-error: true
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
